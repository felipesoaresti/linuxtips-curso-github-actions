name: Arquivos compartilhados entre steps 

on: 
  push:
    branches:
      - main

jobs: 
  job_1:
    runs-on: ubuntu-latest
    steps: 
      - name: Confere versão Ubuntu
        run: cat /etc/os-release

      - name: Exibir Menssagem 
        run: echo "Teste de exibição!!! Funfou?" > mensagem.txt
  
  job_2:
    runs-on: ubuntu-latest
      steps:
        - name: Qualquer outra coisa
          run: ls -lha
      
        - name: Ler o conteudo do arquivo mensagem.txt
          run: cat mensagem.txt

