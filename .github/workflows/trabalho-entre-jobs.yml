name: Arquivos compartilhados entre jobs

on: 
  push:
    branches:
      - main

jobs: 
  job_1:
    runs-on: ubuntu-latest
    steps: 
      - name: Confere versão Ubuntu
        run: cat /etc/os-release

      - name: Exibir Menssagem 
        run: echo "Teste de exibição!!! Funfou?" > ${{ github.workspace }}/mensagem.txt

      - uses: actions/upload-artifact@v4
        with:
          name: strigus
          path: ${{ github.workspace }}/mensagem.txt

  
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
      steps:
        - uses: actions/download-artifact@v4
          with: 
            name: strigus
            path: mensagem.txt

        - name: Ver o ocnteudo do diretprio 
          run: ls -lha
      
        - name
        
        
          - name: Ler o conteudo do arquivo mensagem.txt
          run: cat mensagem.txt

