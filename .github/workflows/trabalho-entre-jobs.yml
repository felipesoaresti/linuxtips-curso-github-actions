name: Arquivos compartilhados entre jobs

on: 
  push:
    branches:
      - main

jobs: 
  job_1:
    runs-on: ubuntu-latest
    steps: 
      - name: Confere versão Ubuntu
        run: cat /etc/os-release

      - name: Exibir Menssagem 
        run: echo "Teste de exibição!!! Funfou?" > ${{ github.workspace }}/mensagem.txt

      - uses: actions/upload-artifact@v4
        with:
          name: strigus-upload
          path: ${{ github.workspace }}/mensagem.txt

  
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - uses: actions/download-artifact@v4
        with: 
          name: strigus-upload
          path: strigus

      - name: Ver o conteudo do diretprio 
        run: ls -lha  && ls  ./strigus/
    
      - name: Acessa arquivo mensagem
        run: mv strigus/mensagem.txt . && rm -rf ./strigus
      
      - name: Ver o conteudo do diretório e do arquivo mensagem.txt
        run: ls -lha && cat mensagem.txt



